name: Code security

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Review pull request dependency changes
        if: github.event_name == 'pull_request' && vars.GHAS_ENABLED == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
      - name: Audit dependencies without GitHub Advanced Security
        if: github.event_name != 'pull_request' || vars.GHAS_ENABLED != 'true'
        run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: vars.GHAS_ENABLED != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        if: vars.GHAS_ENABLED != 'true'
        run: npm ci
      - name: Run fallback static analysis
        if: vars.GHAS_ENABLED != 'true'
        run: |
          npm run lint
          npm run typecheck
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401
        if: vars.GHAS_ENABLED == 'true'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401
        if: vars.GHAS_ENABLED == 'true'
        with:
          category: /language:javascript-typescript
