name: Agentic workflow synchronization
on:
  push:
    paths:
      - ".github/workflows/*.md"
      - "scripts/sync-agentic-workflows.mjs"
  pull_request:
    paths:
      - ".github/workflows/*.md"
      - "scripts/sync-agentic-workflows.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentic-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synchronization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the lockfile compiler version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.81.6 --force
      - run: npm run verify:agentic-sync
