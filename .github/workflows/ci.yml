name: Deterministic verification

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_COMMIT_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install the lockfile compiler version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.81.6 --force
      - name: Run deterministic checks and record every outcome
        run: node scripts/verify-ci.mjs
      - name: Compile Bicep without installing tools
        id: bicep
        continue-on-error: true
        uses: Azure/bicep-build-action@d2a88e5c7150cd562f3e8b8f361560db2cb4d5c5
        with:
          bicepFilePath: infra/main.bicep
          outputFilePath: reports/bicep/main.json
      - name: Record Bicep compiler outcome
        if: always()
        env:
          OUTCOME: ${{ steps.bicep.outcome }}
        run: node scripts/record-action-outcome.mjs bicep-compile "$OUTCOME" Azure/bicep-build-action
      - name: Retain conservative historical Azure validation evidence
        if: always()
        run: |
          mkdir -p reports/azure
          jq -n --arg candidate "$EVIDENCE_COMMIT_SHA" '{
            schemaVersion: 1,
            evidenceType: "historical-azure-validation",
            candidateCommit: $candidate,
            source: {
              pullRequest: 1,
              commit: "fe5213d6991d1a1ba3a28ea3ec13685ac654ed7b",
              validatedAt: "2026-10-06",
              record: ".azure/deployment-plan.md"
            },
            azure: {
              subscriptionId: "ad92e163-a85e-40cc-bb50-054b0b8197a8",
              tenantId: "1cf61a60-a877-46a7-86bc-a8f76b6ab441",
              location: "eastus2",
              template: "infra/subscription.bicep",
              parameters: "infra/subscription.demo.bicepparam",
              validation: {status: "passed", scope: "subscription"},
              whatIf: {status: "passed", create: 40, modify: 0, delete: 0}
            },
            currentPreconditions: {
              resourceGroup: "rg-dark-factory-demo-eus2",
              resourceGroupExists: false,
              deploymentIdentityExists: false,
              deploymentAuthorized: false
            },
            limitation: "Historical validation only; no current Azure validation or mutation is claimed. Separate bootstrap authority must precreate the resource group before the deployment identity is created and remains resource-group-scoped."
          }' > reports/azure/historical-validation.json
      - name: Enforce evidence policy
        if: always()
        run: node scripts/evidence.mjs generate-and-validate
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-evidence-${{ github.run_id }}
          path: |
            .evidence/
            coverage/
            reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Expose evidence on the run summary
        if: always()
        run: |
          echo "## Verification evidence" >> "$GITHUB_STEP_SUMMARY"
          test -f .evidence/manifest.json && cat .evidence/manifest.json >> "$GITHUB_STEP_SUMMARY" || echo "Manifest unavailable" >> "$GITHUB_STEP_SUMMARY"

  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_COMMIT_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Review pull request dependency changes
        if: github.event_name == 'pull_request' && vars.GHAS_ENABLED == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
      - name: Audit dependencies and retain machine-readable evidence
        run: |
          mkdir -p reports/security
          npm audit --omit=dev --audit-level=high --json \
            > reports/security/dependency-audit.json
          jq --arg commit "$EVIDENCE_COMMIT_SHA" '. + {_evidence:{commit:$commit}}' reports/security/dependency-audit.json > reports/security/audit.tmp
          mv reports/security/audit.tmp reports/security/dependency-audit.json
      - name: Publish exact-head dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security-${{ env.EVIDENCE_COMMIT_SHA }}-${{ github.run_attempt }}
          path: reports/security/dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_COMMIT_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: vars.GHAS_ENABLED != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        if: vars.GHAS_ENABLED != 'true'
        run: npm ci
      - name: Run fallback static analysis
        id: fallback
        if: vars.GHAS_ENABLED != 'true'
        run: |
          npm run lint
          npm run typecheck
      - id: codeql-init
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401
        if: vars.GHAS_ENABLED == 'true'
        with:
          languages: javascript-typescript
      - id: codeql-analysis
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401
        if: vars.GHAS_ENABLED == 'true'
        with:
          category: /language:javascript-typescript
          output: reports/security/codeql-results
      - name: Record exact-head CodeQL or fallback outcome
        if: always()
        env:
          FALLBACK_OUTCOME: ${{ steps.fallback.outcome }}
          CODEQL_INIT_OUTCOME: ${{ steps.codeql-init.outcome }}
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
        run: |
          mkdir -p reports/security
          jq -n \
            --arg sha "$EVIDENCE_COMMIT_SHA" \
            --arg fallback "$FALLBACK_OUTCOME" \
            --arg init "$CODEQL_INIT_OUTCOME" \
            --arg analysis "$CODEQL_ANALYSIS_OUTCOME" \
            '{schemaVersion:1,commit:$sha,fallbackOutcome:$fallback,codeqlInitOutcome:$init,codeqlAnalysisOutcome:$analysis}' \
            > reports/security/codeql-summary.json
      - name: Publish exact-head CodeQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-${{ env.EVIDENCE_COMMIT_SHA }}-${{ github.run_attempt }}
          path: reports/security/codeql*
          if-no-files-found: error
          retention-days: 30

  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EVIDENCE_COMMIT_SHA }}
      - run: docker build --tag dark-factory:${{ env.EVIDENCE_COMMIT_SHA }} .
      - run: mkdir -p reports/security/trivy
      - name: Scan repository dependencies, secrets, and IaC
        id: filesystem
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: reports/security/trivy/filesystem.sarif
          exit-code: "1"
      - name: Scan built container
        id: container
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: dark-factory:${{ env.EVIDENCE_COMMIT_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: reports/security/trivy/container.sarif
          exit-code: "1"
      - name: Publish exact-head Trivy evidence
        if: always()
        run: jq -n --arg commit "$EVIDENCE_COMMIT_SHA" '{schemaVersion:1,commit:$commit}' > reports/security/trivy/metadata.json
      - name: Upload exact-head Trivy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-${{ env.EVIDENCE_COMMIT_SHA }}-${{ github.run_attempt }}
          path: reports/security/trivy/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Trivy outcomes
        if: steps.filesystem.outcome != 'success' || steps.container.outcome != 'success'
        run: exit 1

  merge-group:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    env:
      MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
      MERGE_GROUP_RESULT: .integration/merge-group-result.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Revalidate every queued pull request
        id: validate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/integration/validate-merge-group.mjs
      - name: Publish the merge-group integration check
        if: always()
        env:
          CHECK_SHA: ${{ env.MERGE_GROUP_SHA }}
          CHECK_CONCLUSION: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          CHECK_SUMMARY: ${{ steps.validate.outcome == 'success' && 'Every queued pull request retains exact-head evidence and merging lifecycle state.' || 'One or more queued pull requests no longer satisfy autonomous integration policy.' }}
          CHECK_DETAILS_PATH: ${{ env.MERGE_GROUP_RESULT }}
          GITHUB_CHECK_TOKEN: ${{ github.token }}
        run: node scripts/integration/publish-check.mjs
      - name: Enforce the merge-group decision
        if: steps.validate.outcome != 'success'
        run: exit 1
