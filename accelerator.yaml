  - Node.js / TypeScript / React
documentation:
  overview: README.md
  setup_demo_engagement_support: docs/operations-runbook.md
  architecture: docs/architecture.md
  deployment: infra/README.md
assets:
  screenshot: docs/media/control-room.png
  scenario_evidence: docs/media/scenario-results.png
  walkthrough: docs/media/walkthrough.webm
  transcript: docs/media/walkthrough.vtt
experience:
  dashboard: Synthetic operational records by default
  scenarios: Credential-free after dependency installation; simulated external effects
  live: Requires configured GitHub/Azure services and a production operations adapter
prerequisites:
  local:
    - Node.js 22 and npm 10 or newer
    - Network access for initial dependency installation
  live:
    - GitHub App installation and required organization entitlements
    - Azure subscription, scoped identities, and connected runners
engagement:
  motion: Discovery workshop followed by a scoped non-production pilot
  measures:
    - Acceptance criteria mapped to executable evidence
    - Traceable mutations and idempotent retries
    - Bounded stopping and verified recovery
    - Baseline comparison of lead time and manual touches
limitations:
  - Offline scenarios do not update dashboard fixtures or deploy resources
  - Sample metrics and costs are not measured customer outcomes
  - Live deployment parameter files remain specific to the original demonstration
